name: Voxel Vault iOS build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
  push:
    branches: ['main', 'feat/**', 'release/**']
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run core quality checks
        run: |
          npm run test:universal
          npm run test:proximity
          npm run test:proximity:adversarial
          npm run test:ai

      - name: Generate iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          npx cap doctor

      - name: Build iOS Simulator target
        run: |
          xcodebuild -version
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS device target
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
