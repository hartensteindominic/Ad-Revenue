name: V6 3D polish

on:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: write

jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[v6-3d-polish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Apply Voxel Vault 3D UX polish
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/components/VaultUniverse.js')
          s = p.read_text()

          old = """  function LiveArtwork({ item, interactive = false }) {\n    const props = { seed: item.seed, rarity: item.rarity, material: item.material, compact: !interactive, showcase: !interactive, interactive, label: false };\n    return item.renderMode === 'voxel' ? <VoxelViewer shape={item.shape} {...props} /> : <ArtPreview family={item.family} {...props} />;\n  }\n"""
          new = """  function LiveArtwork({ item, interactive = false }) {\n    const props = { seed: item.seed, rarity: item.rarity, material: item.material, compact: !interactive, showcase: !interactive, interactive, label: false };\n    // Every collectible gets a real interactive 3D representation. renderMode remains metadata for future adapters, not a reason to downgrade the collector experience to a flat preview.\n    return <VoxelViewer shape={item.shape} {...props} />;\n  }\n\n  function LazyLiveArtwork({ item }) {\n    const hostRef = useRef(null);\n    const [ready, setReady] = useState(false);\n\n    useEffect(() => {\n      const node = hostRef.current;\n      if (!node) return undefined;\n      const observer = new IntersectionObserver((entries) => {\n        if (entries.some((entry) => entry.isIntersecting)) {\n          setReady(true);\n          observer.disconnect();\n        }\n      }, { rootMargin: '700px' });\n      observer.observe(node);\n      return () => observer.disconnect();\n    }, []);\n\n    return <div ref={hostRef} style={{ width: '100%', height: '100%' }}>\n      {ready ? <LiveArtwork item={item} /> : <PreviewArt item={item} />}\n    </div>;\n  }\n"""
          if old not in s:
              raise SystemExit('LiveArtwork block not found')
          s = s.replace(old, new, 1)

          old_cards = """            {index < 2 ? <div className=\"cardLive3D\"><LiveArtwork item={item}/></div> : <PreviewArt item={item}/>}<span className=\"edition\">"""
          new_cards = """            <div className=\"cardLive3D\"><LazyLiveArtwork item={item}/></div><span className=\"edition\">"""
          if old_cards not in s:
              raise SystemExit('card renderer block not found')
          s = s.replace(old_cards, new_cards, 1)

          s = s.replace(
              'The first featured cards render real 3D, while every object opens into a full interactive 3D inspection.',
              'Every collectible becomes a real 3D object as you scroll. Tap any piece for a full interactive inspection, then rotate, zoom and explore it.'
          )

          p.write_text(s)

          v = Path('app/components/VoxelViewer.js')
          s = v.read_text()
          old_loader = """      loader.load(assetUrl, (gltf) => {\n        if (disposed) return;\n        gltfScene = gltf.scene;\n        gltfScene.traverse((object) => {\n          if (object.isMesh) {\n            object.castShadow = !compact;\n            object.receiveShadow = !compact;\n          }\n        });\n        group.visible = false;\n        scene.add(gltfScene);\n        frameObject(gltfScene);\n        if (gltf.animations?.length) {\n          gltfMixer = new THREE.AnimationMixer(gltfScene);\n          gltf.animations.forEach((clip) => gltfMixer.clipAction(clip).play());\n        }\n      }, undefined, () => {});\n"""
          new_loader = """      loader.load(assetUrl, (gltf) => {\n        if (disposed) return;\n        gltfScene = gltf.scene;\n        let meshCount = 0;\n        gltfScene.traverse((object) => {\n          if (object.isMesh) {\n            meshCount += 1;\n            object.castShadow = !compact;\n            object.receiveShadow = !compact;\n          }\n        });\n        // A malformed/empty GLB must never leave a blank card. Keep the deterministic voxel fallback visible.\n        if (!meshCount) {\n          console.warn('[Voxel Vault] GLB contained no renderable meshes; using deterministic 3D fallback.', assetUrl);\n          gltfScene = null;\n          return;\n        }\n        group.visible = false;\n        scene.add(gltfScene);\n        frameObject(gltfScene);\n        if (gltf.animations?.length) {\n          gltfMixer = new THREE.AnimationMixer(gltfScene);\n          gltf.animations.forEach((clip) => gltfMixer.clipAction(clip).play());\n        }\n      }, undefined, (error) => {\n        // Fail soft: the generated voxel object remains visible and interactive.\n        console.warn('[Voxel Vault] GLB/GLTF failed to load; using deterministic 3D fallback.', assetUrl, error);\n      });\n"""
          if old_loader not in s:
              raise SystemExit('GLTF loader block not found')
          s = s.replace(old_loader, new_loader, 1)
          v.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/components/VaultUniverse.js app/components/VoxelViewer.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Polish every collectible into lazy-loaded 3D experiences [v6-3d-polish]'
          git push origin HEAD:${{ github.ref_name }}
