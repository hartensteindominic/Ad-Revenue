name: V6 3D polish

on:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: write

jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[v6-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Apply Voxel Vault 3D UX polish
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/components/VaultUniverse.js')
          s = p.read_text()
          old = """  function LiveArtwork({ item, interactive = false }) {\n    const props = { seed: item.seed, rarity: item.rarity, material: item.material, compact: !interactive, showcase: !interactive, interactive, label: false };\n    return item.renderMode === 'voxel' ? <VoxelViewer shape={item.shape} {...props} /> : <ArtPreview family={item.family} {...props} />;\n  }\n"""
          new = """  function LiveArtwork({ item, interactive = false }) {\n    const props = { seed: item.seed, rarity: item.rarity, material: item.material, compact: !interactive, showcase: !interactive, interactive, label: false };\n    // Every collectible gets a real interactive 3D representation. renderMode remains metadata for future adapters.\n    return <VoxelViewer shape={item.shape} {...props} />;\n  }\n\n  function LazyLiveArtwork({ item }) {\n    const hostRef = useRef(null);\n    const [ready, setReady] = useState(false);\n    useEffect(() => {\n      const node = hostRef.current;\n      if (!node || typeof IntersectionObserver === 'undefined') { setReady(true); return undefined; }\n      const observer = new IntersectionObserver((entries) => {\n        if (entries.some((entry) => entry.isIntersecting)) { setReady(true); observer.disconnect(); }\n      }, { rootMargin: '700px' });\n      observer.observe(node);\n      return () => observer.disconnect();\n    }, []);\n    return <div ref={hostRef} style={{ width: '100%', height: '100%' }}>{ready ? <LiveArtwork item={item} /> : <PreviewArt item={item} />}</div>;\n  }\n"""
          if old in s: s = s.replace(old, new, 1)
          old_cards = """            {index < 2 ? <div className=\"cardLive3D\"><LiveArtwork item={item}/></div> : <PreviewArt item={item}/>}<span className=\"edition\">"""
          new_cards = """            <div className=\"cardLive3D\"><LazyLiveArtwork item={item}/></div><span className=\"edition\">"""
          if old_cards in s: s = s.replace(old_cards, new_cards, 1)
          s = s.replace('The first featured cards render real 3D, while every object opens into a full interactive 3D inspection.', 'Every collectible becomes a real 3D object as you scroll. Tap any piece for a full interactive inspection, then rotate, zoom and explore it.')
          p.write_text(s)

          v = Path('app/components/VoxelViewer.js')
          s = v.read_text()
          s = s.replace("getContext('webgl2', { failIfMajorPerformanceCaveat: true })", "getContext('webgl2', { antialias: true })")
          s = s.replace("getContext('webgl', { failIfMajorPerformanceCaveat: true })", "getContext('webgl', { antialias: true })")
          if 'touch-action:none' not in s: s = s.replace('<style jsx>{`', '<style jsx>{` .voxelViewer canvas{touch-action:none;-webkit-user-select:none;user-select:none;}')
          old_loader = """      loader.load(assetUrl, (gltf) => {\n        if (disposed) return;\n        gltfScene = gltf.scene;\n        gltfScene.traverse((object) => {\n          if (object.isMesh) {\n            object.castShadow = !compact;\n            object.receiveShadow = !compact;\n          }\n        });\n        group.visible = false;\n        scene.add(gltfScene);\n        frameObject(gltfScene);\n        if (gltf.animations?.length) {\n          gltfMixer = new THREE.AnimationMixer(gltfScene);\n          gltf.animations.forEach((clip) => gltfMixer.clipAction(clip).play());\n        }\n      }, undefined, () => {});\n"""
          new_loader = """      loader.load(assetUrl, (gltf) => {\n        if (disposed) return;\n        gltfScene = gltf.scene;\n        let meshCount = 0;\n        gltfScene.traverse((object) => {\n          if (object.isMesh) { meshCount += 1; object.castShadow = !compact; object.receiveShadow = !compact; }\n        });\n        if (!meshCount) { console.warn('[Voxel Vault] GLB contained no renderable meshes; using deterministic 3D fallback.', assetUrl); gltfScene = null; return; }\n        group.visible = false;\n        scene.add(gltfScene);\n        frameObject(gltfScene);\n        if (gltf.animations?.length) { gltfMixer = new THREE.AnimationMixer(gltfScene); gltf.animations.forEach((clip) => gltfMixer.clipAction(clip).play()); }\n      }, undefined, (error) => { console.warn('[Voxel Vault] GLB/GLTF failed to load; using deterministic 3D fallback.', assetUrl, error); });\n"""
          if old_loader in s: s = s.replace(old_loader, new_loader, 1)
          v.write_text(s)

          a = Path('app/components/ArtPreview.js')
          s = a.read_text().replace("getContext('webgl2', { failIfMajorPerformanceCaveat: true })", "getContext('webgl2', { antialias: true })").replace("getContext('webgl', { failIfMajorPerformanceCaveat: true })", "getContext('webgl', { antialias: true })")
          a.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/components/VaultUniverse.js app/components/VoxelViewer.js app/components/ArtPreview.js
          if git diff --cached --quiet; then echo 'No changes needed.'; exit 0; fi
          git commit -m 'Harden every collectible 3D runtime and mobile WebGL fallback [v6-applied]'
          git push origin HEAD:${{ github.ref_name }}
