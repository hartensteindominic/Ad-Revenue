name: Voxel Vault web build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Repository does not currently commit a package-lock.json.
      # Use npm install so CI can validate a production build without a cache contract.
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://voxel-vault.vercel.app
