name: Voxel Vault web build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository intentionally has no committed package-lock.json yet.
      # Do not enable setup-node npm caching until a lockfile is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://voxel-vault.vercel.app
