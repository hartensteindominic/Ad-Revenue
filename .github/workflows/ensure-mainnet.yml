name: Ensure Ethereum Mainnet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'chore: normalize mainnet') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert remaining Creator Studio testnet labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/create/page.js')
          s = p.read_text()
          replacements = {
            "const SEPOLIA_CHAIN_HEX='0xaa36a7';": "const MAINNET_CHAIN_HEX='0x1';",
            'async function ensureSepolia(provider){': 'async function ensureMainnet(provider){',
            'if(chain===SEPOLIA_CHAIN_HEX) return;': 'if(chain===MAINNET_CHAIN_HEX) return;',
            "{chainId:SEPOLIA_CHAIN_HEX}": "{chainId:MAINNET_CHAIN_HEX}",
            "chainName:'Sepolia'": "chainName:'Ethereum Mainnet'",
            "name:'Sepolia ETH'": "name:'Ether'",
            "rpcUrls:['https://rpc.sepolia.org']": "rpcUrls:['https://cloudflare-eth.com']",
            "blockExplorerUrls:['https://sepolia.etherscan.io']": "blockExplorerUrls:['https://etherscan.io']",
            'await ensureSepolia(provider);': 'await ensureMainnet(provider);',
            'Minted successfully on Sepolia.': 'Minted successfully on Ethereum mainnet.',
            '<strong>SEPOLIA</strong>': '<strong>ETHEREUM MAINNET</strong>',
            'Waiting for deployment configuration': 'Waiting for mainnet deployment configuration',
            'Approve the transaction in your wallet': 'Approve the real ETH transaction in your wallet',
            'The UI is ready, but a real contract address must be supplied before minting can occur.': 'Mainnet minting is locked until the deployed Ethereum mainnet NFT contract address is supplied.',
            'Wallet transactions always require approval in your wallet.': 'Mainnet transactions use real ETH and always require wallet approval.'
          }
          for a,b in replacements.items():
            s = s.replace(a,b)
          p.write_text(s)
          PY

      - name: Commit mainnet normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/create/page.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'chore: normalize mainnet creator flow'
          git push origin main
