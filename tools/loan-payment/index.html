<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free loan payment calculator. Estimate monthly payment, total interest and total amount paid."><link rel="canonical" href="https://hartensteindominic.github.io/Ad-Revenue/tools/loan-payment/"><title>Loan Payment Calculator | ToolMint</title><style>body{margin:0;background:#07111f;color:#f4f8ff;font:16px/1.6 system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:32px 20px}.card{background:#0d1a2b;border:1px solid #203751;border-radius:20px;padding:24px;margin:20px 0}input{width:100%;padding:12px;box-sizing:border-box;margin:6px 0 14px;background:#081422;color:#fff;border:1px solid #29435f;border-radius:10px}button{background:#62e6a6;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.result{margin-top:18px;padding:18px;background:#091725;border-radius:12px}.muted{color:#9db0c8}a{color:#62e6a6}</style></head><body><main class="wrap"><a href="../../">← ToolMint</a><h1>Loan Payment Calculator</h1><p class="muted">Estimate monthly payment, total paid and total interest for a standard amortizing loan.</p><section class="card"><label>Loan amount</label><input id="principal" type="number" value="10000" min="0"><label>Annual interest rate (%)</label><input id="rate" type="number" value="8" min="0" step="0.01"><label>Loan term (years)</label><input id="years" type="number" value="3" min="1"><button onclick="calc()">Calculate payment</button><div class="result" id="result">Enter your numbers and calculate.</div></section><section class="card"><p class="muted">This is an estimate. Actual loans may include fees, taxes, insurance, variable rates or other costs. It is not financial advice.</p></section></main><script>function calc(){const P=+principal.value,r=+rate.value/100/12,n=+years.value*12;const pay=r?P*r/(1-Math.pow(1+r,-n)):P/n,total=pay*n;result.innerHTML=`Monthly payment: <strong>$${pay.toFixed(2)}</strong><br>Total paid: $${total.toFixed(2)}<br>Total interest: $${(total-P).toFixed(2)}`}</script></body></html>
