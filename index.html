<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuralPulse 3D • Quantum Field Visualizer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#02040a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;overflow:hidden}
  #sidebar{width:380px;background:rgba(10,14,26,0.85);backdrop-filter:blur(16px);border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;padding:16px;gap:12px;z-index:10;overflow-y:auto}
  .brand{font-size:13px;font-weight:900;letter-spacing:1.5px;color:#38bdf8;line-height:1.2}
  .brand span{background:linear-gradient(90deg,#38bdf8,#c084fc,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#64748b}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#cbd5e1}
  input[type=range]{accent-color:#c084fc;cursor:pointer;width:120px}
  select{background:#0f172a;color:#fff;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 8px;font-size:11px}
  button{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:11px;transition:opacity 0.2s}
  button:hover{opacity:0.9}
  #viewer{flex:1;position:relative;background:radial-gradient(circle at center,#0f172a 0%,#02040a 100%)}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:absolute;top:16px;right:16px;background:rgba(2,4,10,0.8);backdrop-filter:blur(8px);padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);font-size:11px;color:#94a3b8;z-index:5}
  .overlay span{color:#38bdf8;font-weight:700}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="sidebar">
  <div class="brand">NEURALPULSE 3D<br><span>QUANTUM FIELD ENGINE v2.0</span></div>

  <div class="card">
    <div class="card-title">Field Dynamics</div>
    <div class="row"><span>Particle Count</span><input type="range" id="count-range" min="5000" max="50000" step="5000" value="25000" oninput="updateParticleCount(this.value)"><span id="count-val">25k</span></div>
    <div class="row"><span>Wave Frequency</span><input type="range" id="freq-range" min="1" max="10" step="0.5" value="3" oninput="waveFreq=parseFloat(this.value)"></div>
    <div class="row"><span>Expansion Speed</span><input type="range" id="speed-range" min="0.1" max="3" step="0.1" value="1" oninput="animSpeed=parseFloat(this.value)"></div>
    <div class="row"><span>Geometry Mode</span>
      <select id="geo-mode" onchange="switchGeometry(this.value)">
        <option value="galaxy">Quantum Vortex</option>
        <option value="torus">Hyper Torus</option>
        <option value="sphere">Neural Sphere</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Visual Aesthetics</div>
    <div class="row"><span>Primary Hue</span><input type="range" id="hue-range" min="0" max="360" step="1" value="200" oninput="baseHue=parseInt(this.value)"></div>
    <div class="row"><span>Auto-Rotate</span><input type="checkbox" id="rot-toggle" checked onchange="isAutoRotate=this.checked"></div>
  </div>

  <div class="card">
    <div class="card-title">Actions</div>
    <button onclick="resetCameraViews()">Reset Perspective</button>
  </div>
</div>

<div id="viewer">
  <div class="overlay">
    FPS: <span id="fps">60</span><br>
    Particles: <span id="active-particles">25,000</span>
  </div>
  <canvas id="canvas"></canvas>
</div>

<script>
  let scene, camera, renderer, controls, particleSystem;
  let particleCount = 25000;
  let waveFreq = 3, animSpeed = 1, baseHue = 200, isAutoRotate = true;
  let currentGeo = 'galaxy';
  let clock = new THREE.Clock();
  let frameCount = 0, lastTime = 0;

  function init() {
    const container = document.getElementById('viewer');
    scene = new THREE.Scene();
    
    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 15, 30);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    buildParticles();
    window.addEventListener('resize', onResize);
    animate();
  }

  function buildParticles() {
    if (particleSystem) scene.remove(particleSystem);

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const color = new THREE.Color();

    for (let i = 0; i < particleCount * 3; i += 3) {
      let x = 0, y = 0, z = 0;

      if (currentGeo === 'galaxy') {
        const u = Math.random(), v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = Math.cbrt(Math.random()) * 12;
        x = r * Math.sin(phi) * Math.cos(theta);
        y = (Math.random() - 0.5) * 4;
        z = r * Math.sin(phi) * Math.sin(theta);
      } else if (currentGeo === 'torus') {
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI * 2;
        const R = 10, r = 3;
        x = (R + r * Math.cos(v)) * Math.cos(u);
        y = r * Math.sin(v);
        z = (R + r * Math.cos(v)) * Math.sin(u);
      } else {
        const u = Math.random(), v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 10;
        x = r * Math.sin(phi) * Math.cos(theta);
        y = r * Math.sin(phi) * Math.sin(theta);
        z = r * Math.cos(phi);
      }

      positions[i] = x;
      positions[i+1] = y;
      positions[i+2] = z;

      color.setHSL((baseHue / 360 + Math.random() * 0.1) % 1, 0.8, 0.6);
      colors[i] = color.r;
      colors[i+1] = color.g;
      colors[i+2] = color.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true
    });

    particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);
    document.getElementById('active-particles').innerText = particleCount.toLocaleString();
  }

    function animate(now = 0) {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime() * animSpeed;

    if (particleSystem) {
      if (isAutoRotate) particleSystem.rotation.y = elapsedTime * 0.1;
      const positions = particleSystem.geometry.attributes.position.array;
      for (let i = 0; i < positions.length; i += 3) {
        positions[i+1] += Math.sin(elapsedTime + positions[i] * waveFreq * 0.1) * 0.008;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
    }

    controls.update();
    renderer.render(scene, camera);

    frameCount++;
    if (now - lastTime >= 1000) {
      document.getElementById('fps').innerText = Math.round((frameCount * 1000) / (now - lastTime));
      frameCount = 0;
      lastTime = now;
    }
  }

  function updateParticleCount(val) {
    particleCount = parseInt(val);
    document.getElementById('count-val').innerText = (particleCount / 1000) + 'k';
    buildParticles();
  }

  function switchGeometry(val) {
    currentGeo = val;
    buildParticles();
  }

  function resetCameraViews() {
    camera.position.set(0, 15, 30);
    controls.target.set(0, 0, 0);
  }

  function onResize() {
    const container = document.getElementById('viewer');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
