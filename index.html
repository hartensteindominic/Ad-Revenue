<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperStream XD • Holographic Volumetric Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030712;color:#e2e8f0;font-family:system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
#sidebar{width:340px;min-width:260px;background:#0b0f19;border-right:1px solid #1e293b;display:flex;flex-direction:column;padding:8px;gap:6px;overflow-y:auto;z-index:10}
.brand{font-size:12px;font-weight:800;letter-spacing:.8px;color:#38bdf8;line-height:1.2}
.brand span{background:linear-gradient(90deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:5px}
.title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b}
.row{display:flex;justify-content:space-between;align-items:center;font-size:10px;gap:6px;color:#94a3b8}
input[type=range]{accent-color:#a855f7;width:100px;cursor:pointer}
button{border:none;border-radius:6px;padding:7px 8px;font-size:10px;font-weight:700;cursor:pointer;color:#fff}
.btn-p{background:#7c3aed}.btn-p:hover{background:#6d28d9}
.btn-d{background:#dc2626;width:100%}.btn-d.on{background:#ea580c}
.btn-s{background:#1e293b;color:#e2e8f0}
.tabs{display:flex;gap:3px}
.tab{flex:1;padding:6px;background:#1e293b;border:1px solid #334155;border-radius:5px;color:#94a3b8;font-size:10px;font-weight:600;cursor:pointer}
.tab.on{background:#7c3aed;color:#fff;border-color:#6d28d9}
#viewer{flex:1;position:relative;background:radial-gradient(ellipse at center,#0f172a 0%,#030712 75%)}
canvas{display:block;width:100%;height:100%}
.stats{position:absolute;top:10px;right:10px;background:rgba(3,7,18,.9);padding:7px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.06);font-size:10px;color:#94a3b8;line-height:1.45;z-index:5}
.stats b{color:#a855f7}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:9px;padding:2px 6px;border-radius:4px;background:#1e293b;border:1px solid #334155;cursor:pointer}
.chip.on{background:#7c3aed;border-color:#6d28d9;color:#fff}
textarea{width:100%;height:40px;background:#1e293b;border:1px solid #334155;border-radius:5px;color:#e2e8f0;font-size:9px;padding:4px;resize:none}
.drop{border:1.5px dashed #334155;padding:8px;border-radius:6px;text-align:center;font-size:10px;cursor:pointer;color:#64748b}
.drop.over{border-color:#a855f7;background:rgba(168,85,247,.08)}
input[type=file]{display:none}
#vid{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="sidebar">
  <div class="brand">HYPERSTREAM XD<br><span>HOLOGRAPHIC ENGINE</span></div>

  <div class="tabs">
    <button class="tab on" id="t-cap" onclick="mode('cap')">📡 Live</button>
    <button class="tab" id="t-load" onclick="mode('load')">📂 Load</button>
    <button class="tab" id="t-paste" onclick="mode('paste')">📋 Paste</button>
  </div>

  <div class="card" id="p-cap">
    <div class="title">Live Hologram Capture</div>
    <button class="btn-d" id="scanBtn" onclick="toggleScan()">START HOLOGRAM</button>
    <div style="display:flex;gap:4px">
      <button class="btn-s" style="flex:1" id="camBtn" onclick="switchCam()">📷 Front</button>
      <button class="btn-s" style="flex:1" id="perfBtn" onclick="togglePerf()">⚡ Fast</button>
    </div>
    <div class="row"><span>Density</span><input type="range" id="step" min="1" max="4" value="2" oninput="stepSize=+this.value;document.getElementById('stepV').textContent=this.value"><span id="stepV">2</span></div>
    <div class="row"><span>Depth</span><input type="range" id="depth" min="8" max="60" value="36" step="1" oninput="depthMul=+this.value"></div>
    <div class="row"><span>Size</span><input type="range" id="psize" min="0.008" max="0.06" value="0.024" step="0.002" oninput="ptSize=+this.value;updSize()"></div>
    <div class="row"><span>Layers</span><input type="range" id="layers" min="1" max="6" value="4" oninput="layerN=+this.value;document.getElementById('layV').textContent=this.value;buildChips()"><span id="layV">4</span></div>
    <div class="row"><span>Spread</span><input type="range" id="spread" min="0.15" max="0.9" value="0.48" step="0.01" oninput="layerSp=+this.value"></div>
    <div style="font-size:9px;color:#64748b">Nodes <b id="nLive">0</b> · Frames <b id="nFrm">0</b></div>
    <div style="display:flex;gap:4px">
      <button class="btn-p" style="flex:1;background:#059669" onclick="expJSON()">Export JSON</button>
      <button class="btn-s" style="flex:1" onclick="copyJSON()">Copy</button>
    </div>
    <textarea id="jsonOut" readonly placeholder="Hologram payload…"></textarea>
  </div>

  <div class="card" id="p-load" style="display:none">
    <div class="title">Load Payload</div>
    <div class="drop" id="drop" onclick="document.getElementById('fi').click()">Drop JSON or click
      <input type="file" id="fi" accept=".json" onchange="fileIn(event)">
    </div>
    <button class="btn-s" onclick="clearAll()">Clear Scene</button>
  </div>

  <div class="card" id="p-paste" style="display:none">
    <div class="title">Paste Matrix</div>
    <textarea id="jsonIn" placeholder='{"HyperStream5D":[...]}'></textarea>
    <button class="btn-p" onclick="pasteIn()">Process</button>
  </div>

  <div class="card">
    <div class="title">Hologram Controls</div>
    <div class="row"><span>Mode</span>
      <select id="rmode" onchange="rMode=this.value;if(frames.length)drawFrame(playIdx,metaV)" style="background:#1e293b;color:#fff;border:1px solid #334155;border-radius:4px;font-size:10px;padding:2px">
        <option value="points">Volumetric</option>
        <option value="solid">Solid</option>
        <option value="wire">Wire</option>
      </select>
    </div>
    <div class="row"><span>Meta E</span><input type="range" id="meta" min="0" max="100" value="10" oninput="metaV=this.value/100;document.getElementById('metaV').textContent=metaV.toFixed(2);isPlay=false;if(frames.length)drawFrame(playIdx,metaV)"><span id="metaV">0.10</span></div>
    <div class="row"><span>Scrub</span><input type="range" id="scrub" min="0" max="0" value="0" oninput="playIdx=+this.value;isPlay=false;document.getElementById('playBtn').textContent='▶';if(frames.length)drawFrame(playIdx,metaV)"><span id="scrubV">0/0</span></div>
    <div class="row"><span>FPS</span><input type="range" id="fps" min="6" max="24" value="12" oninput="playFPS=+this.value"></div>
    <div style="display:flex;gap:4px">
      <button class="btn-s" style="flex:1" id="playBtn" onclick="togglePlay()">▶ Play</button>
      <button class="btn-s" style="flex:1" onclick="resetCam()">↺ View</button>
    </div>
    <div class="row"><span>Orbit</span><input type="checkbox" id="orbit" checked onchange="autoOrbit=this.checked"></div>
    <div class="row"><span>Pulse</span><input type="checkbox" id="pulse" checked onchange="doPulse=this.checked"></div>
    <div class="title" style="margin-top:2px">Layers</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card">
    <div class="title">Export</div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <button class="btn-p" style="background:#0f766e" onclick="expPNG()">📸 PNG</button>
      <button class="btn-p" style="background:#2563eb" id="webmBtn" onclick="expWebM()">🎥 WebM</button>
    </div>
  </div>
</div>

<div id="viewer">
  <div class="stats">
    <span id="status">Idle</span><br>
    FPS <b id="fpsD">—</b> · Nodes <b id="nodesD">0</b>
  </div>
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="c3"></canvas>
</div>

<script>
const $ = id => document.getElementById(id);
let scene, cam, ren, ctrl, grid;
let layers = [], prevPos = [];
let video, c2d, ctx;
let scanning = false, rec = [], fIdx = 0;
let stepSize = 2, depthMul = 36, ptSize = 0.024;
let layerN = 4, layerSp = 0.48, smooth = 0.52;
let rMode = 'points', metaV = 0.10, playFPS = 12;
let isPlay = false, frames = [], playIdx = 0, lastT = 0;
let autoOrbit = true, doPulse = true, vis = [];
let facing = 'user', stream = null, ready = false;
let perf = false, lastVol = 0;
const VOL_MS = 50;
let fc = 0, ft = 0, phase = 0;

window.onload = () => {
  init3();
  initCam('user');
  dropInit();
  buildChips();
};

function init3() {
  const box = $('viewer');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030712, 0.03);
  cam = new THREE.PerspectiveCamera(46, box.clientWidth / box.clientHeight, 0.05, 2000);
  cam.position.set(0, 0.15, 3.2);

  ren = new THREE.WebGLRenderer({ canvas: $('c3'), antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
  ren.setSize(box.clientWidth, box.clientHeight);
  ren.setPixelRatio(Math.min(devicePixelRatio || 1, 1.15));
  ren.setClearColor(0x030712);

  if (THREE.OrbitControls) {
    ctrl = new THREE.OrbitControls(cam, ren.domElement);
    ctrl.enableDamping = true;
    ctrl.dampingFactor = 0.08;
    ctrl.autoRotate = true;
    ctrl.autoRotateSpeed = 0.55;
  }

  grid = new THREE.GridHelper(36, 36, 0x1e293b, 0x0f172a);
  grid.position.y = -1.6;
  scene.add(grid);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const l1 = new THREE.DirectionalLight(0xffffff, 0.9); l1.position.set(2, 4, 4); scene.add(l1);
  const l2 = new THREE.DirectionalLight(0xa855f7, 0.35); l2.position.set(-3, -1, -2); scene.add(l2);

  window.onresize = () => {
    cam.aspect = box.clientWidth / box.clientHeight;
    cam.updateProjectionMatrix();
    ren.setSize(box.clientWidth, box.clientHeight);
  };
  loop();
}

function stopStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; ready = false;
}

function initCam(face) {
  video = $('vid');
  c2d = document.createElement('canvas');
  ctx = c2d.getContext('2d', { willReadFrequently: true });
  stopStream();
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: face }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24 } },
    audio: false
  }).then(s => {
    stream = s; facing = face;
    video.srcObject = s;
    video.play().then(() => {
      ready = true;
      $('camBtn').textContent = face === 'environment' ? '📷 Back' : '📷 Front';
    });
  }).catch(() => {
    if (face !== 'user') initCam('user');
  });
}

function switchCam() { initCam(facing === 'user' ? 'environment' : 'user'); }

function togglePerf() {
  perf = !perf;
  if (perf) {
    stepSize = 3; layerN = 3; ptSize = 0.03;
    $('step').value = 3; $('stepV').textContent = 3;
    $('layers').value = 3; $('layV').textContent = 3;
    $('psize').value = 0.03;
    $('perfBtn').style.background = '#059669';
  } else {
    stepSize = 2; layerN = 4; ptSize = 0.024;
    $('step').value = 2; $('stepV').textContent = 2;
    $('layers').value = 4; $('layV').textContent = 4;
    $('psize').value = 0.024;
    $('perfBtn').style.background = '';
  }
  buildChips(); updSize();
}

function resetCam() {
  cam.position.set(0, 0.15, 3.2);
  if (ctrl) { ctrl.target.set(0, 0, 0); ctrl.update(); }
}

function loop(now = 0) {
  requestAnimationFrame(loop);
  if (ctrl) {
    ctrl.autoRotate = autoOrbit;
    ctrl.update();
  }
  phase = now * 0.001;
  fc++;
  if (now - ft > 1000) {
    $('fpsD').textContent = Math.round(fc * 1000 / (now - ft));
    fc = 0; ft = now;
  }

  const need = ready && video.readyState >= 2 && (scanning || !frames.length);
  if (need && now - lastVol > VOL_MS) {
    lastVol = now;
    sample();
  }

  if (doPulse && layers.length && rMode === 'points') {
    for (let i = 0; i < layers.length; i++) {
      if (layers[i]?.visible) {
        const s = 1 + Math.sin(phase * 0.9 + i * 0.6) * 0.008;
        layers[i].scale.setScalar(s);
      }
    }
  }

  if (isPlay && frames.length && now - lastT > 1000 / playFPS) {
    drawFrame(playIdx, metaV);
    playIdx = (playIdx + 1) % frames.length;
    $('scrub').value = playIdx;
    $('scrubV').textContent = playIdx + '/' + (frames.length - 1);
    lastT = now;
  }
  ren.render(scene, cam);
}

function sample() {
  const w = video.videoWidth || 640, h = video.videoHeight || 480;
  if (c2d.width !== w) { c2d.width = w; c2d.height = h; }
  ctx.drawImage(video, 0, 0, w, h);
  let pix;
  try { pix = ctx.getImageData(0, 0, w, h).data; } catch { return; }

  const pos = [], col = [];
  const cx = w * 0.5, cy = h * 0.5, maxR = Math.hypot(cx, cy) || 1;
  const sx = 1.2 * Math.min(w / h, 1.5), sy = 1.2;
  const maxP = perf ? 28000 : 48000;
  const thr = 0.05;

  for (let y = 0; y < h && pos.length / 3 < maxP; y += stepSize) {
    for (let x = 0; x < w && pos.length / 3 < maxP; x += stepSize) {
      const i = (y * w + x) * 4;
      const r = pix[i] / 255, g = pix[i + 1] / 255, b = pix[i + 2] / 255;
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      if (lum < thr) continue;

      // Edge boost for stronger silhouette / hologram feel
      let edge = 0;
      if (x > stepSize && x < w - stepSize && y > stepSize && y < h - stepSize) {
        const l2 = 0.299 * pix[i - 4] + 0.587 * pix[i - 3] + 0.114 * pix[i - 2];
        const r2 = 0.299 * pix[i + 4] + 0.587 * pix[i + 5] + 0.114 * pix[i + 6];
        edge = Math.abs(l2 - r2);
      }

      const nx = ((w - x) / w) * 2 - 1;
      const ny = -((y / h) * 2 - 1);
      const dx = (x - cx) / maxR, dy = (y - cy) / maxR;
      const rad = dx * dx + dy * dy;

      // Depth: luminance + edge → more holographic volume
      let nz = (Math.pow(lum, 0.42) - 0.22) * (depthMul * 0.24);
      nz += edge * 0.45;
      nz -= rad * 0.48;
      nz -= nx * nx * 0.12;

      pos.push(nx * sx * (1 - rad * 0.05), ny * sy * (1 - rad * 0.04), nz);

      // Cool holographic tint + slight rim
      const rim = Math.min(1, rad * 1.2);
      const avg = (r + g + b) / 3;
      col.push(
        Math.min(1, avg + (r - avg) * 1.1 + rim * 0.02 + 0.05),
        Math.min(1, avg + (g - avg) * 1.1 + rim * 0.06 + 0.08),
        Math.min(1, avg + (b - avg) * 1.15 + rim * 0.18 + 0.18)
      );
    }
  }

  const n = pos.length / 3;
  $('nLive').textContent = n.toLocaleString();
  $('nodesD').textContent = (n * layerN).toLocaleString();

  if (scanning || !frames.length) {
    buildLayers(pos, col);
    $('nLive').textContent = n.toLocaleString();
  }

  if (scanning) {
    const v = [];
    for (let i = 0; i < pos.length; i += 3) v.push(+pos[i].toFixed(3), +pos[i + 1].toFixed(3), +pos[i + 2].toFixed(3));
    rec.push({ v, c: col.map(x => +x.toFixed(2)), meta: 0.3 + Math.random() * 0.2, layers: layerN, spread: layerSp });
    fIdx++;
    $('nFrm').textContent = rec.length;
    if (fIdx % 10 === 0) $('jsonOut').value = JSON.stringify({ HyperStream5D: rec, layers: layerN, spread: layerSp });
  }
}

function clearLayers() {
  for (const o of layers) {
    scene.remove(o);
    o.geometry?.dispose();
    o.material?.dispose();
  }
  layers = []; prevPos = [];
}

function buildLayers(basePos, baseCol) {
  while (layers.length > layerN) {
    const o = layers.pop();
    scene.remove(o); o.geometry.dispose(); o.material.dispose();
    prevPos.pop();
  }
  const n = basePos.length / 3;
  if (n < 4) return;
  const maxL = Math.max(1, layerN - 1);
  const mOff = metaV * 0.28;

  for (let L = 0; L < layerN; L++) {
    const t = L / maxL;
    const e = t * t * (3 - 2 * t);
    const s = e - 0.5;
    const zOff = s * layerSp * 3.2;
    const yOff = s * layerSp * 0.14;
    const xOff = s * layerSp * 0.09;
    const sc = 1 + s * 0.05;
    const front = 1 - t;

    const pos = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);
    for (let i = 0, j = 0; i < n; i++, j += 3) {
      let px = basePos[j] * sc + xOff;
      let py = basePos[j + 1] * sc + yOff + mOff * (0.4 + L * 0.03);
      let pz = basePos[j + 2] * sc + zOff;
      if (prevPos[L]?.length === pos.length && smooth > 0.05) {
        const p = prevPos[L], k = smooth;
        px = px * (1 - k) + p[j] * k;
        py = py * (1 - k) + p[j + 1] * k;
        pz = pz * (1 - k) + p[j + 2] * k;
      }
      pos[j] = px; pos[j + 1] = py; pos[j + 2] = pz;
      col[j] = Math.min(1, baseCol[j] * (0.92 + front * 0.1));
      col[j + 1] = Math.min(1, baseCol[j + 1] * (0.95 + L * 0.01));
      col[j + 2] = Math.min(1, baseCol[j + 2] * (0.8 + (1 - front) * 0.35));
    }
    prevPos[L] = pos;
    const size = ptSize * (1.04 - L * 0.04);
    const op = Math.max(0.3, 0.88 - L * 0.1);

    let o = layers[L];
    if (!o) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      o = new THREE.Points(g, new THREE.PointsMaterial({
        size, sizeAttenuation: true, vertexColors: true,
        transparent: true, opacity: op, depthWrite: false
      }));
      scene.add(o);
      layers[L] = o;
    } else {
      if (o.geometry.attributes.position.count !== n) {
        o.geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        o.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
      } else {
        o.geometry.attributes.position.array.set(pos);
        o.geometry.attributes.color.array.set(col);
        o.geometry.attributes.position.needsUpdate = true;
        o.geometry.attributes.color.needsUpdate = true;
      }
      o.material.size = size;
      o.material.opacity = op;
    }
    o.visible = vis[L] !== false;
  }
  buildChips();
}

function updSize() {
  layers.forEach((o, L) => { if (o?.material) o.material.size = ptSize * (1.04 - L * 0.04); });
}

function toggleScan() {
  scanning = !scanning;
  const b = $('scanBtn');
  if (scanning) {
    rec = []; fIdx = 0;
    b.textContent = 'STOP HOLOGRAM';
    b.classList.add('on');
    $('status').textContent = 'Recording';
  } else {
    b.textContent = 'START HOLOGRAM';
    b.classList.remove('on');
    $('status').textContent = 'Ready';
    $('jsonOut').value = JSON.stringify({ HyperStream5D: rec, layers: layerN, spread: layerSp });
    if (rec.length) loadData({ HyperStream5D: rec, layers: layerN, spread: layerSp });
  }
}

function mode(m) {
  ['cap', 'load', 'paste'].forEach(x => {
    $('t-' + x).classList.toggle('on', x === m);
    $('p-' + x).style.display = x === m ? 'flex' : 'none';
  });
}

function buildChips() {
  const c = $('chips');
  c.innerHTML = '';
  for (let i = 0; i < layerN; i++) {
    if (vis[i] === undefined) vis[i] = true;
    const d = document.createElement('div');
    d.className = 'chip' + (vis[i] ? ' on' : '');
    d.textContent = 'L' + (i + 1);
    d.onclick = () => {
      vis[i] = !vis[i];
      if (layers[i]) layers[i].visible = vis[i];
      d.classList.toggle('on', vis[i]);
    };
    c.appendChild(d);
  }
}

function toNum(a) {
  if (!a) return [];
  const o = [];
  for (let i = 0; i < a.length; i++) { const n = +a[i]; if (isFinite(n)) o.push(n); }
  return o;
}

function extract(data) {
  let raw = data.HyperStream5D || data.HyperStream4D || data.hyperStream || (Array.isArray(data) ? data : null);
  if (!raw) {
    const k = Object.keys(data).find(x => Array.isArray(data[x]));
    if (k) raw = data[k];
  }
  if (!raw) return null;
  return raw.map(f => ({
    vertices: toNum(f.v || f.vertices || []),
    colors: toNum(f.c || f.colors || []),
    meta: f.meta ?? 0.5,
    layers: f.layers || data.layers || layerN,
    spread: f.spread ?? data.spread ?? layerSp
  })).filter(f => f.vertices.length);
}

function drawFrame(idx, meta) {
  if (!frames.length) return;
  const f = frames[idx % frames.length];
  const src = f.vertices, cols = f.colors;
  const Lc = f.layers || layerN, sp = f.spread ?? layerSp;
  const ts = src.length % 4 === 0 ? 4 : 3;
  const pos = [], col = [];
  for (let i = 0; i < src.length; i += ts) {
    pos.push(src[i], src[i + 1] + (f.meta || 0.5) * meta * 0.32, src[i + 2]);
    const ci = (i / ts) * 3;
    if (cols.length >= ci + 3) col.push(cols[ci], cols[ci + 1], cols[ci + 2]);
    else col.push(0.5, 0.45, 0.95);
  }
  const pc = layerN, ps = layerSp;
  layerN = Lc; layerSp = sp;
  if (rMode === 'points') buildLayers(pos, col);
  else {
    clearLayers();
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));
    const side = Math.floor(Math.sqrt(pos.length / 3));
    if (side > 4) {
      const idx = [];
      for (let y = 0; y < side - 1; y++) for (let x = 0; x < side - 1; x++) {
        const i = y * side + x;
        if (i + side + 1 < pos.length / 3) {
          idx.push(i, i + 1, i + side, i + 1, i + side + 1, i + side);
        }
      }
      if (idx.length) g.setIndex(idx);
    }
    g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.3, metalness: 0.15,
      wireframe: rMode === 'wire', side: THREE.DoubleSide
    }));
    mesh.rotation.y = Math.PI;
    scene.add(mesh);
    layers = [mesh];
  }
  layerN = pc; layerSp = ps;
  $('nodesD').textContent = ((pos.length / 3) * Lc).toLocaleString();
}

function loadData(data) {
  const seq = extract(data);
  if (!seq?.length) return;
  frames = seq;
  playIdx = 0;
  isPlay = true;
  $('playBtn').textContent = '⏸';
  if (data.layers) layerN = data.layers;
  if (data.spread) layerSp = data.spread;
  $('layers').value = layerN; $('layV').textContent = layerN;
  $('spread').value = layerSp;
  $('scrub').max = seq.length - 1;
  $('scrub').value = 0;
  $('scrubV').textContent = '0/' + (seq.length - 1);
  drawFrame(0, metaV);
  $('status').textContent = 'Active';
  buildChips();
}

function clearAll() {
  isPlay = false; frames = []; playIdx = 0;
  clearLayers();
  $('nodesD').textContent = '0';
  $('status').textContent = 'Cleared';
  $('playBtn').textContent = '▶';
}

function togglePlay() {
  if (!frames.length) return;
  isPlay = !isPlay;
  $('playBtn').textContent = isPlay ? '⏸' : '▶';
}

function expJSON() {
  if (!rec.length) return;
  const blob = new Blob([JSON.stringify({ HyperStream5D: rec, layers: layerN, spread: layerSp })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hologram_' + Date.now() + '.json';
  a.click();
}

function copyJSON() {
  const t = $('jsonOut').value;
  if (t) navigator.clipboard.writeText(t);
}

function expPNG() {
  if (!layers.length) return;
  ren.render(scene, cam);
  const a = document.createElement('a');
  a.href = $('c3').toDataURL('image/png');
  a.download = 'holo_' + Date.now() + '.png';
  a.click();
}

function expWebM() {
  if (!layers.length) return;
  const btn = $('webmBtn');
  btn.disabled = true;
  try {
    const s = $('c3').captureStream(12);
    const mr = new MediaRecorder(s, { mimeType: 'video/webm' });
    const chunks = [];
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = 'holo_' + Date.now() + '.webm';
      a.click();
      btn.disabled = false;
    };
    mr.start();
    let n = 0;
    (function tick() {
      n++;
      ren.render(scene, cam);
      if (n < 36) requestAnimationFrame(tick);
      else mr.stop();
    })();
  } catch {
    btn.disabled = false;
  }
}

function dropInit() {
  const d = $('drop');
  ['dragenter', 'dragover'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) readF(f); });
}

function readF(f) {
  const r = new FileReader();
  r.onload = e => { try { loadData(JSON.parse(e.target.result)); } catch {} };
  r.readAsText(f);
}

function fileIn(e) { if (e.target.files[0]) readF(e.target.files[0]); }

function pasteIn() {
  try { loadData(JSON.parse($('jsonIn').value.trim())); } catch {}
}
</script>
